x-interactive: &interactive
  tty: true        # docker run -t
  stdin_open: true # docker run -i

x-build-args: &build-args
  context: .
  args:
    DOTNET_VERSION: 6.0

services:
  pldotnet-build:
    container_name: pldotnet-build
    image: pldotnet:build
    <<: *interactive
    command: sh -c "bash /app/pldotnet/Dockerfiles/scripts/build_packages.sh"
    build:
      dockerfile: Dockerfiles/deb_package/Dockerfile_deb-build
      <<: *build-args
    environment:
      USE_DOTNETBUILD: "FALSE"
      PGDATA: /var/lib/postgresql/data1/
      POSTGRES_HOST_AUTH_METHOD: trust
      # POSTGRES_PASSWORD: # your password
    volumes:
      - ./src/:/app/pldotnet/src/
      - ./Makefile:/app/pldotnet/Makefile
      - ./DotNetEngine/:/app/pldotnet/DotNetEngine/
      - ./ba-sql/:/app/pldotnet/ba-sql/
      - ./debian/packages/:/app/pldotnet/debian/packages/
      - ./debian/pgversions:/app/pldotnet/debian/pgversions
      - ./debian/rules:/app/pldotnet/debian/rules
