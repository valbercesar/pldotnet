      context: .
      args:
        DOTNET_VERSION: 3.1
    environment:
      USE_DOTNETBUILD: "FALSE"
    volumes_from:
      - pldotnet-build:ro
    volumes:
      - $PWD/debian/test_results:/app/pldotnet/debian/test_results
