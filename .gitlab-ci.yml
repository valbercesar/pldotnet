stages:
  - test

variables:
  POSTGRES_PASSWORD: postgres
  POSTGRES_PORT: 5432
  DOCKER_TLS_CERTDIR: "" # disable TLS so CLI can talk to DinD
  DOCKER_HOST: tcp://docker:2375 # docker CLI -> DinD service

test_matrix:
  stage: test
  image: docker:25.0.0-cli
  services:
    - name: docker:25.0.0-dind
      command: ["--registry-mirror=https://registry-1.docker.io"] # optional
  parallel:
    matrix:
      - POSTGRES_VERSION: ["11", "12", "13", "14", "15", "16", "17"]
  interruptible: true
  resource_group: "test-matrix-$CI_COMMIT_REF_SLUG"
  tags:
    - docker
  before_script:
    - apk add --no-cache make bash
  script:
    # 1. write .env
    - echo "POSTGRES_VERSION=$POSTGRES_VERSION" > .env
    - echo "POSTGRES_PORT=$POSTGRES_PORT" >> .env
    - echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env

    # 2. launch stack
    - echo "🔧 Starting Docker Compose with POSTGRES_VERSION=$POSTGRES_VERSION"
    - make dev & # background

    # 3. wait until DB replies
    - |
      echo "⏳ Waiting for PostgreSQL to become ready..."
      for i in {1..30}; do
        if docker exec pldotnet-runtime pg_isready -U postgres >/dev/null 2>&1; then
          echo "✅ PostgreSQL ready after $((i*5)) s"
          break
        fi
        echo "🔄 Still waiting… $((i*5)) s"
        sleep 5
      done

    # 4. run tests
    - echo "🧪 Running tests..."
    - make test-docker

    # 5. teardown
    - echo "🧹 Cleaning up..."
    - docker compose -f docker-compose-dev.yml down -v || true
