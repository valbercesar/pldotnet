stages:
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: true
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_PORT: 5432
  DOTNET_VERSION: 9.0
  DATABASE_CONNECTION_STRING: "Host=127.0.0.1;Port=$POSTGRES_PORT;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD;Database=$POSTGRES_DB"
  TargetFramework: net9.0

test_matrix:
  stage: test
  image: ubuntu:25.04
  parallel:
    matrix:
      # - POSTGRES_VERSION: ["11", "12", "13", "14", "15", "16", "17"]
      - POSTGRES_VERSION: ["17"]
  interruptible: true
  resource_group: "test-matrix-$CI_COMMIT_REF_SLUG"
  before_script:
    - echo "$POSTGRES_VERSION" > debian/pgversions
    - apt update && apt upgrade -y
    - apt install -y make sudo curl wget gnupg
    - apt install -y postgresql-common
    - /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
    - apt install -y postgresql-$POSTGRES_VERSION
    - pg_ctlcluster $POSTGRES_VERSION main start
    - apt install -y libglib2.0-dev devscripts build-essential lintian debhelper postgresql-server-dev-all dotnet-sdk-$DOTNET_VERSION dotnet-runtime-$DOTNET_VERSION pkg-config
    - mkdir -p /app
    - ln -s "$CI_PROJECT_DIR" /app/pldotnet

  script:
    - make build-local
    - dpkg -i debian/packages/dotnet-$DOTNET_VERSION-postgresql-$POSTGRES_VERSION-pldotnet_0.99-rc1_amd64.deb
    - runuser -u $POSTGRES_USER -- psql -c "CREATE EXTENSION pldotnet; ALTER USER $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD';"
    - runuser -u $POSTGRES_USER -- psql -c "CREATE OR REPLACE FUNCTION sum2SmallInt(a smallint, b smallint) RETURNS smallint AS $$ if (a == null) a = 0; if (b == null) b = 0; return (short)(a+b); $$ LANGUAGE plcsharp;"
    - runuser -u $POSTGRES_USER -- psql -c "SELECT sum2SmallInt(CAST(100 AS smallint), CAST(101 AS smallint));"
    - make test-local
