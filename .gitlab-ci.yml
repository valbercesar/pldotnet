stages:
  - test
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: true
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_PORT: 5432
  DOTNET_VERSION: 9.0
  DATABASE_CONNECTION_STRING: "Host=127.0.0.1;Port=$POSTGRES_PORT;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD;Database=$POSTGRES_DB"
  TargetFramework: net9.0

.default-test-template: &test-template
  stage: test
  image: ubuntu:25.04
  interruptible: true
  before_script:
    - echo "$POSTGRES_VERSION" > debian/pgversions
    - apt update && apt upgrade -y
    - apt install -y make sudo curl wget gnupg
    - apt install -y postgresql-common
    - /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
    - apt install -y postgresql-$POSTGRES_VERSION
    - pg_ctlcluster $POSTGRES_VERSION main start
    - apt install -y libglib2.0-dev devscripts build-essential lintian debhelper postgresql-server-dev-all dotnet-sdk-$DOTNET_VERSION dotnet-runtime-$DOTNET_VERSION pkg-config
    - mkdir -p /app
    - ln -s "$CI_PROJECT_DIR" /app/pldotnet
  script:
    - make build-local
    - dpkg -i debian/packages/dotnet-$DOTNET_VERSION-postgresql-$POSTGRES_VERSION-pldotnet_0.99-rc1_amd64.deb
    - runuser -u $POSTGRES_USER -- psql -c "CREATE EXTENSION pldotnet; ALTER USER $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD';"
    - make test-local

# Runs only on develop branch with full version matrix
test_matrix_develop:
  <<: *test-template
  parallel:
    matrix:
      - POSTGRES_VERSION: ["11", "12", "13", "14", "15", "16", "17"]
  resource_group: test-matrix-develop
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'

# Runs on all merge requests for PG 17
test_pg17_merge_request:
  <<: *test-template
  variables:
    POSTGRES_VERSION: "17"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

release_deb:
  stage: release
  image: ubuntu:25.04
  variables:
    POSTGRES_VERSION: "17"
  before_script:
    - apt update && apt upgrade -y
    - apt install -y make sudo curl wget gnupg
    - apt install -y postgresql-common
    - /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
    - apt install -y postgresql-17
    - apt install -y libglib2.0-dev devscripts build-essential lintian debhelper postgresql-server-dev-all dotnet-sdk-$DOTNET_VERSION dotnet-runtime-$DOTNET_VERSION pkg-config
  script:
    - make build-local
  artifacts:
    paths:
      - debian/packages/dotnet-*
    expire_in: 1 week
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for tag $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Packages"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/debian/packages/"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
